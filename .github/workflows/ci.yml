name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-22.04
            python: '3.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pytest -q

      - name: Desktop pet opens (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          xvfb-run -a python -m smartram widget-test

      - name: Desktop pet opens (Windows, macOS)
        if: runner.os != 'Linux'
        run: python -m smartram widget-test

      # The guardian must stay light: fail if it uses over 5% of a core or 250 MB.
      - name: Own footprint (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/footprint.py 45 5 250

      - name: Own footprint (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/footprint.py 45 5 250

      - name: Installer (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          SMARTRAM_SOURCE: ${{ github.workspace }}
          SMARTRAM_HOME: ${{ runner.temp }}/smartram
        run: |
          sh install.sh
          sleep 8
          "$SMARTRAM_HOME/venv/bin/smartram" status
          "$SMARTRAM_HOME/venv/bin/smartram" doctor
          cat "$SMARTRAM_HOME/guardian.log"
          "$SMARTRAM_HOME/venv/bin/smartram" uninstall

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SMARTRAM_SOURCE: ${{ github.workspace }}
          SMARTRAM_HOME: ${{ runner.temp }}\smartram
        run: |
          .\install.ps1
          Start-Sleep -Seconds 8
          $smartram = Join-Path $env:SMARTRAM_HOME 'venv\Scripts\smartram.exe'
          & $smartram status
          if ($LASTEXITCODE -ne 0) { throw "status failed: $LASTEXITCODE" }
          & $smartram doctor
          Get-Content (Join-Path $env:SMARTRAM_HOME 'guardian.log')
          & $smartram uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed: $LASTEXITCODE" }
