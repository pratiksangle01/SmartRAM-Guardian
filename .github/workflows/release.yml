name: Release

# Publishes a GitHub release with installable packages whenever the version in
# smartram/__init__.py changes on main. Nothing happens for a version that
# already has a release.
on:
  push:
    branches: [main]
    paths: ['smartram/__init__.py']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish the release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' smartram/__init__.py)
          test -n "$version"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          python -m pip install --quiet build
          python -m build
          awk -v heading="## $version" '$0 == heading {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          gh release create "v$version" dist/* --target "$GITHUB_SHA" \
            --title "SmartRAM Guardian $version" --notes-file notes.md
