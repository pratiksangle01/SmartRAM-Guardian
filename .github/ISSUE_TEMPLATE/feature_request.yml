name: Idea
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like, and what problem does it solve?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      multiple: true
      options: [Windows, macOS, Linux]
