name: Background process to add
description: Suggest a background helper the guardian should close by itself, or one it must never close
labels: [enhancement]
body:
  - type: input
    id: name
    attributes:
      label: Process name
      description: Exactly as shown in `smartram status`, Task Manager, Activity Monitor or `ps`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What should happen to it?
      options:
        - Close it when idle (background junk)
        - Never close it (protected)
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What is it, and why is that safe?
      description: Which app it belongs to, what it does, and roughly how much memory it holds.
    validations:
      required: true
